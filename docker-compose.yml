services:
  # 0. MinIO - S3-compatible object storage (free/local)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-storage:/data
    ports:
      - "19000:9000" # MinIO S3 API
      - "19001:9001" # MinIO Console

  # 0.1 Bucket bootstrap for MinIO
  minio-createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}); do echo 'waiting for minio...' && sleep 2; done;
      /usr/bin/mc mb -p local/tempo-traces;
      /usr/bin/mc mb -p local/loki-logs;
      exit 0;
      "

  # 1. The OTel Collector — receives traces from the app and forwards them to Tempo
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - DT_OTLP_ENDPOINT=${DT_OTLP_ENDPOINT:-https://dynatrace.invalid/api/v2/otlp}
      - DT_API_TOKEN=${DT_API_TOKEN:-invalid-token}
    ports:
      - "4317:4317" # OTLP gRPC port (Flask sends traces here)
      - "4318:4318" # OTLP HTTP port
      - "13133:13133" # Collector health check
    depends_on:
      - tempo # Ensure Tempo is up before the collector tries to export to it

  # 2. Tempo — distributed tracing backend (stores and queries traces)
  tempo:
    image: grafana/tempo:2.4.1
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo.yaml
      - tempo-storage:/tmp/tempo
    ports:
      - "3200:3200" # Tempo HTTP API (used by Grafana)
      - "4319:4317" # Tempo OTLP gRPC ingest (from collector inside Docker)
      - "4320:4318" # Tempo OTLP HTTP ingest (optional)
    depends_on:
      - minio
      - minio-createbuckets

  # 3. Grafana — visualization dashboard
  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./observability/grafana/dashboard-provisioning.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - ./observability/grafana/notification-channels.yaml:/etc/grafana/provisioning/notifiers/notification-channels.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - EMAIL_ALERT_TO=${EMAIL_ALERT_TO:-simao.bmarcos@gmail.com}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${GF_SMTP_HOST:-smtp.gmail.com:587}
      - GF_SMTP_USER=${GF_SMTP_USER:-simao.bmarcos@gmail.com}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-wexgworzpirknlzf}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-simao.bmarcos@gmail.com}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-Grafana Alerts}
      - GF_SMTP_SKIP_VERIFY=${GF_SMTP_SKIP_VERIFY:-true}
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - otel-collector
      - prometheus
      - loki
      - mimir

  # 4. Prometheus — scrapes app metrics from Flask /metrics endpoint
  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml
      - prometheus-storage:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
      - mimir

  # 4.1 Alertmanager - handles notifications from Prometheus alerts
  alertmanager:
    image: prom/alertmanager:latest
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"

  # 5. Mimir — long-term storage backend for Prometheus metrics
  mimir:
    image: grafana/mimir:latest
    command: 
      - "-config.file=/etc/mimir.yaml"
    volumes:
      - ./observability/mimir-config.yaml:/etc/mimir.yaml
      - mimir-storage:/mimir-storage
    ports:
      - "9009:9009" # Mimir HTTP API
      - "9011:9095" # Mimir gRPC
    environment:
      - LOG_LEVEL=info

  # 6. Loki — log aggregation backend
  loki:
    image: grafana/loki:latest
    command: 
      - "-config.file=/etc/loki-config.yaml"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki-config.yaml
      - loki-storage:/loki
    ports:
      - "3100:3100" # Loki HTTP API
    depends_on:
      - minio
      - minio-createbuckets

  # 7. Promtail — log collector agent (collects logs and sends to Loki)
  promtail:
    image: grafana/promtail:latest
    command:
      - -config.file=/etc/promtail-config.yaml
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/var/log/mcdonalds-app:ro
    depends_on:
      - loki

volumes:
  prometheus-storage:
  mimir-storage:
  loki-storage:
  tempo-storage:
  minio-storage: