global:
  scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/prometheus-rules.yml

remote_write:
  - url: http://mimir:9009/api/v1/push

scrape_configs:
  - job_name: "flask_app"
    static_configs:
      - targets: ["host.docker.internal:5000"]
