groups:
  - name: McDonalds API Alerts
    interval: 30s
    rules:
      # Alert: High Error Rate (> 5%)
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_total{status_code=~"[45].."}[5m]))
            /
            sum(rate(http_server_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Error Rate Detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Alert: High Latency P95 (> 500ms)
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, rate(http_server_request_duration_seconds_bucket[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Request Latency Detected"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 500ms)"

      # Alert: Service Down (health check failing)
      - alert: ServiceDown
        expr: |
          up{job="flask_app", instance="otel-collector:8889"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "McDonalds API Service Down"
          description: "Flask API is not responding to health checks"

      # Alert: High Memory Usage (> 500MB)
      - alert: HighMemoryUsage
        expr: |
          max(process_resident_memory_bytes{job="flask_app", instance="otel-collector:8889"}) > 500000000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Memory Usage"
          description: "Process memory is {{ $value | humanize }}B (threshold: 500MB)"
